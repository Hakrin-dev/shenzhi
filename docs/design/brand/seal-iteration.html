<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深知印 · 瘦金体迭代</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f9fcf7; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #0F1419; padding: 40px 48px; }
  h1 { font-size: 22px; }
  .row { display: flex; align-items: flex-end; gap: 48px; margin-top: 32px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; color: #6B7280; }
  .dark { background: #0F1419; border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<h1>深知印 · 瘦金体「深知」迭代稿</h1>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 瘦金风格笔画:细、挺、顿笔成点、撇捺如刃 -->
    <g id="sz-glyphs">
      <!-- ============ 深 (x 33-63, y 19-46) ============ -->
      <!-- 氵 -->
      <path d="M36.8 21.5 L34.9 24.3" />
      <path d="M36.8 26.2 L34.9 29" />
      <path d="M35.2 31.8 L38.8 29.5" />
      <!-- 冖 -->
      <path d="M43.5 21 L43 23.6" />
      <path d="M43.5 21.3 H61 L59.2 23.7" />
      <path d="M61 20.5 l2.2 0.8 l-1.7 1.5 z" fill="white" stroke="none"/>
      <!-- 八 -->
      <path d="M48.5 25.6 L45.4 29.5" />
      <path d="M53.5 25.6 L57.2 29.5" />
      <!-- 木 -->
      <path d="M43 33 H59 L57.2 34.9" />
      <path d="M59 32.2 l2.2 0.8 l-1.7 1.5 z" fill="white" stroke="none"/>
      <path d="M51 30.4 l1.3 1.1 l-1.3 1.1 z" fill="white" stroke="none"/>
      <path d="M51 30.8 V44.4 L48.9 42.5" />
      <path d="M50.2 33.6 Q46.5 40 42 44.8" />
      <path d="M51.8 33.6 Q55.5 40 60 44.8" />
      <!-- ============ 知 (x 34-62, y 52-79) ============ -->
      <!-- 矢:末笔捺变点,避让右口 -->
      <path d="M43 53.8 L39.6 58.2" />
      <path d="M37 58.8 H46.8 L45.2 60.5" />
      <path d="M46.8 58 l2.2 0.8 l-1.7 1.5 z" fill="white" stroke="none"/>
      <path d="M36 63.8 H48 L46.4 65.5" />
      <path d="M48 63 l2.2 0.8 l-1.7 1.5 z" fill="white" stroke="none"/>
      <path d="M42 63.8 Q40.6 70.5 35.5 77.2" />
      <path d="M45.3 70.2 L48.6 73.8" />
      <!-- 口 -->
      <path d="M53 61.5 V73.5" />
      <path d="M53 61.5 H61 V73.5" />
      <path d="M61 60.7 l2.2 0.8 l-1.7 1.5 z" fill="white" stroke="none"/>
      <path d="M53 73.5 H61" />
    </g>
  </defs>
</svg>

<div class="row">
  <div class="item">
    <svg width="320" height="320" viewBox="0 0 96 96">
      <rect x="6" y="6" width="84" height="84" rx="18" fill="#002FA7"/>
      <use href="#sz-glyphs" stroke="white" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    320px
  </div>
  <div class="item">
    <svg width="168" height="168" viewBox="0 0 96 96">
      <rect x="6" y="6" width="84" height="84" rx="18" fill="#002FA7"/>
      <use href="#sz-glyphs" stroke="white" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    168px
  </div>
  <div class="item">
    <svg width="72" height="72" viewBox="0 0 96 96">
      <rect x="6" y="6" width="84" height="84" rx="18" fill="#002FA7"/>
      <use href="#sz-glyphs" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    72px(笔画加粗)
  </div>
  <div class="item">
    <svg width="40" height="40" viewBox="0 0 96 96">
      <rect x="6" y="6" width="84" height="84" rx="18" fill="#002FA7"/>
      <use href="#sz-glyphs" stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    40px
  </div>
  <div class="item">
    <svg width="24" height="24" viewBox="0 0 96 96">
      <rect x="6" y="6" width="84" height="84" rx="18" fill="#002FA7"/>
      <use href="#sz-glyphs" stroke="white" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    24px
  </div>
  <div class="item dark">
    <svg width="40" height="40" viewBox="0 0 96 96">
      <rect x="6" y="6" width="84" height="84" rx="18" fill="#fff"/>
      <use href="#sz-glyphs" stroke="#002FA7" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    反白变体
  </div>
</div>

</body>
</html>
