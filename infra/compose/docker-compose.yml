# 放在 ECS 的 /opt/shenzhi/ 下使用(与线上一致,本文件为唯一事实来源)
# 镜像来自 GitHub Container Registry(ghcr.io),由 GitHub Actions 构建推送
# 部署为拉取式:Watchtower 每 60s 轮询 GHCR latest,发现新 digest 自动 pull + 重建 web
services:
  web:
    image: ghcr.io/hakrin-dev/shenzhi-frontend:latest
    ports:
      - "80:3000"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  watchtower:
    # nicholas-fedor 维护分支:containrrr 官方版已归档,其 client 过老不兼容 Docker 29
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR 私有镜像凭证(ECS 上 root 已 docker login ghcr.io)
      - /root/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup --label-enable
