name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必须显式安装 Buildx:默认 docker builder 不支持 type=gha 缓存后端
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/hakrin-dev/shenzhi-frontend:latest
            ghcr.io/hakrin-dev/shenzhi-frontend:${{ github.sha }}
          # 每次提交写入 revision 标签:镜像 config 变化 → digest 必变,
          # 保证 ECS 上的 Watchtower 总能检测到更新(即使应用代码未变)
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像设为 Public 前的安全关卡:扫描高危漏洞 + 敏感信息残留
      # 结果输出到 Step Summary,不阻断部署(是否公开由人工审阅扫描结果后决定)
      - name: Scan image (vulns + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/hakrin-dev/shenzhi-frontend:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

  # 部署为拉取式:ECS 上的 Watchtower 每 60s 轮询 GHCR latest,发现新 digest 自动 pull + 重建容器。
  # 不再 SSH 入站,安全组无需对公网开放 22 端口(2026-08-07 安全组收紧导致 SSH 部署失败后的改造)。
